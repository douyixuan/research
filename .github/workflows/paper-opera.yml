name: paper-opera

on:
  push:
    paths:
      - 'papers/2025-opera/**'
      - '.github/workflows/paper-opera.yml'
  pull_request:
    paths:
      - 'papers/2025-opera/**'
      - '.github/workflows/paper-opera.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run L1 and scoped L2 reproduction
        working-directory: papers/2025-opera
        run: bash reproduce.sh
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opera-reproduction
          path: papers/2025-opera/results/
