name: paper-trec

on:
  push:
    branches: [main]
    paths:
      - 'papers/2025-trec/**'
      - '.github/workflows/paper-trec.yml'
  pull_request:
    paths:
      - 'papers/2025-trec/**'
      - '.github/workflows/paper-trec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-l2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Environment
        run: |
          java -version
          gcc --version | head -n1
      - name: Run current-release T-Rec mechanism reproduction
        run: bash papers/2025-trec/reproduce.sh
      - name: Show evidence
        run: |
          cat papers/2025-trec/results/l2-summary.json
          for f in direct_trec modern_off modern_on; do
            printf '\n--- %s ---\n' "$f"
            cat "papers/2025-trec/results/${f}.c"
          done
      - name: Publish reproduction evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trec-scoped-l2
          path: papers/2025-trec/results/
          if-no-files-found: error
