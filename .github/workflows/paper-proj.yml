name: paper-proj

on:
  push:
    paths:
      - 'papers/2026-proj/**'
      - '.github/workflows/paper-proj.yml'
  pull_request:
    paths:
      - 'papers/2026-proj/**'
      - '.github/workflows/paper-proj.yml'
  workflow_dispatch:

jobs:
  deterministic-reproduction:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run claim audit and scoped L2 mechanism
        run: bash papers/2026-proj/reproduce.sh
      - name: Upload report and event trace
        uses: actions/upload-artifact@v4
        with:
          name: proj-reproduction-report
          path: |
            papers/2026-proj/results/report.md
            papers/2026-proj/results/pipeline_l2.json
