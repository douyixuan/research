name: paper-ddmt

on:
  pull_request:
    paths:
      - 'papers/2026-ddmt/**'
      - '.github/workflows/paper-ddmt.yml'
  push:
    branches: [main]
    paths:
      - 'papers/2026-ddmt/**'
      - '.github/workflows/paper-ddmt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research repo
        uses: actions/checkout@v6

      - name: Run scoped L1 + L2 reproduction
        run: bash papers/2026-ddmt/reproduce.sh

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ddmt-reproduction-report
          path: papers/2026-ddmt/results/
          if-no-files-found: error
