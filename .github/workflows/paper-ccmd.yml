name: paper-ccmd

on:
  push:
    paths:
      - 'papers/2023-ccmd/**'
      - '.github/workflows/paper-ccmd.yml'
  pull_request:
    paths:
      - 'papers/2023-ccmd/**'
      - '.github/workflows/paper-ccmd.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          gcc --version | head -1
          clang --version | head -1
          objcopy --version | head -1
          readelf --version | head -1
      - name: Run scoped L2 CCMD reproduction
        run: bash papers/2023-ccmd/reproduce.sh
      - name: Upload reproduction result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccmd-reproduction
          path: papers/2023-ccmd/results/
          if-no-files-found: error
