name: paper-adhoc-perses

on:
  push:
    paths:
      - 'papers/2023-adhoc-perses/**'
      - '.github/workflows/paper-adhoc-perses.yml'
  pull_request:
    paths:
      - 'papers/2023-adhoc-perses/**'
      - '.github/workflows/paper-adhoc-perses.yml'
  workflow_dispatch:

jobs:
  claim-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recompute paper-table arithmetic
        run: RUN_OFFICIAL=0 bash papers/2023-adhoc-perses/reproduce.sh
      - name: Upload claim-audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-paper-claim-audit
          path: papers/2023-adhoc-perses/results/paper_claims.json
          if-no-files-found: error

  official-current-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Run official current-source ad-hoc system test
        run: bash papers/2023-adhoc-perses/probe_official_adhoc.sh
      - name: Upload official current-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adhoc-official-current-source
          path: papers/2023-adhoc-perses/results/official/
          if-no-files-found: warn
