name: paper-sfc

on:
  push:
    branches: [main]
    paths:
      - 'papers/2025-sfc/**'
      - '.github/workflows/paper-sfc.yml'
  pull_request:
    paths:
      - 'papers/2025-sfc/**'
      - '.github/workflows/paper-sfc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-l2-official-sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify Bazelisk availability
        run: bazelisk version
      - name: Run pinned official SFC tests
        run: bash papers/2025-sfc/reproduce.sh
      - name: Publish reproduction evidence
        uses: actions/upload-artifact@v6
        with:
          name: sfc-scoped-l2-results
          path: papers/2025-sfc/results/
          if-no-files-found: error
